<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIIA 卷二学习进度</title>
<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --text: #15202b;
  --muted: #64748b;
  --line: #dbe3ef;
  --primary: #0f766e;
  --primary-2: #0ea5a4;
  --accent: #c27803;
  --accent-2: #2563eb;
  --danger: #dc2626;
  --success: #15803d;
  --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
  letter-spacing: 0;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell {
  width: min(1040px, 100%);
  margin: 0 auto;
  padding: 16px 16px 92px;
}
.header {
  flex: 0 0 auto;
  color: #fff;
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.94), rgba(37, 99, 235, 0.9)),
    linear-gradient(45deg, #0f766e, #2563eb);
  border-radius: 8px;
  padding: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.header-top {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
}
.title-block { min-width: 0; }
.eyebrow {
  font-size: 12px;
  opacity: 0.82;
  font-weight: 700;
  margin-bottom: 6px;
}
h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 38px);
  line-height: 1.1;
  letter-spacing: 0;
}
.subtitle {
  margin-top: 8px;
  font-size: 13px;
  opacity: 0.88;
  line-height: 1.45;
}
.countdown {
  flex: 0 0 156px;
  border: 1px solid rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.13);
  border-radius: 8px;
  padding: 12px;
  text-align: right;
}
.countdown-label { font-size: 12px; opacity: 0.86; }
.countdown-value {
  font-size: 34px;
  font-weight: 800;
  line-height: 1.05;
  margin-top: 4px;
}
.countdown-unit { font-size: 12px; opacity: 0.88; }
.progress-summary {
  margin-top: 18px;
}
.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 700;
}
.progress-track {
  margin-top: 8px;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #facc15, #f8fafc);
  transition: width 0.22s ease;
}
.header-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.header-metric {
  min-width: 0;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 10px;
}
.header-metric-label {
  font-size: 11px;
  opacity: 0.82;
  white-space: nowrap;
}
.header-metric-value {
  margin-top: 4px;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.page {
  display: none;
  padding-top: 16px;
}
.page.active {
  display: block;
  padding-bottom: 18px;
}
.section-title {
  font-size: 15px;
  font-weight: 800;
  margin: 12px 0 10px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.section-note {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.subject-grid,
.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.subject-card,
.metric-card,
.panel,
.video-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
}
.subject-card,
.metric-card,
.panel {
  padding: 14px;
}
.subject-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.subject-name {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
}
.subject-pct {
  flex: 0 0 auto;
  color: var(--primary);
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
}
.subject-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.subject-stats strong { color: var(--text); }
.mini-track {
  margin-top: 12px;
  height: 7px;
  background: #e8eef6;
  border-radius: 999px;
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
}
.metric-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.metric-value {
  margin-top: 6px;
  color: var(--primary);
  font-size: 24px;
  font-weight: 900;
  line-height: 1.05;
  overflow-wrap: anywhere;
}
.metric-sub {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.plan-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.plan-lead {
  color: var(--primary);
  font-size: 26px;
  font-weight: 900;
  line-height: 1.1;
}
.plan-text {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}
.timeline {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.timeline-step {
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.timeline-title {
  font-size: 13px;
  font-weight: 800;
}
.timeline-body {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.rank-row {
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.rank-row:last-child { border-bottom: 0; }
.rank-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
}
.rank-name {
  min-width: 0;
  font-size: 13px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rank-value {
  flex: 0 0 auto;
  color: var(--primary);
  font-size: 13px;
  font-weight: 800;
}
.rank-track {
  height: 7px;
  background: #e8eef6;
  border-radius: 999px;
  overflow: hidden;
}
.rank-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--primary-2));
}
.study-chart {
  display: grid;
  grid-template-columns: repeat(14, minmax(0, 1fr));
  gap: 6px;
  height: 178px;
  align-items: end;
  padding-top: 8px;
}
.chart-col {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 4px;
}
.chart-value {
  height: 14px;
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
}
.chart-shell {
  width: 100%;
  height: 112px;
  display: flex;
  align-items: flex-end;
  background: #e8eef6;
  border-radius: 6px;
  overflow: hidden;
}
.chart-fill {
  width: 100%;
  min-height: 0;
  background: linear-gradient(180deg, var(--primary-2), var(--primary));
  border-radius: 6px 6px 0 0;
}
.chart-label {
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
}
.filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 10px;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn,
.utility-btn,
.import-label {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 8px;
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
  font-weight: 750;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}
.filter-btn.active {
  color: #fff;
  border-color: var(--primary);
  background: var(--primary);
}
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 0 14px;
  outline: none;
  color: var(--text);
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
}
.video-list {
  display: grid;
  gap: 9px;
}
.video-item {
  min-height: 68px;
  padding: 12px;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 11px;
  align-items: start;
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.video-item:hover {
  transform: translateY(-1px);
  border-color: rgba(15, 118, 110, 0.38);
}
.video-item.done {
  background: #f0fdfa;
  border-color: rgba(15, 118, 110, 0.28);
}
.video-check {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 2px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 900;
  line-height: 1;
  user-select: none;
  flex: 0 0 auto;
}
.video-item.done .video-check {
  background: var(--primary);
  border-color: var(--primary);
}
.video-info { min-width: 0; }
.video-episode {
  font-size: 14px;
  font-weight: 750;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.video-meta {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  color: var(--muted);
  font-size: 11px;
}
.tag {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: #eef6ff;
  color: var(--accent-2);
  font-weight: 750;
}
.tag.time {
  background: #fffbeb;
  color: var(--accent);
}
.empty {
  padding: 28px 12px;
  text-align: center;
  color: var(--muted);
  background: var(--panel);
  border: 1px dashed var(--line);
  border-radius: 8px;
}
.utilities {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.utility-btn.danger {
  border-color: rgba(220, 38, 38, 0.28);
  color: var(--danger);
}
.import-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 82px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  background: rgba(15, 23, 42, 0.92);
  color: #fff;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 15;
  width: min(680px, calc(100% - 24px));
  height: 62px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  padding: 6px;
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
}
.nav-btn {
  min-width: 0;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}
.nav-btn.active {
  color: #fff;
  background: var(--primary);
}
@media (max-width: 760px) {
  .app-shell { padding: 10px 10px 90px; }
  .header { padding: 16px; }
  .header-top { flex-direction: column; }
  .countdown {
    width: 100%;
    flex-basis: auto;
    text-align: left;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .countdown-value { font-size: 30px; }
  .header-metrics,
  .subject-grid,
  .metric-grid,
  .plan-grid,
  .timeline {
    grid-template-columns: 1fr;
  }
  .header-metric-value { font-size: 16px; }
  .study-chart { gap: 4px; }
  .chart-value, .chart-label { font-size: 8px; }
}
@media (max-width: 390px) {
  .bottom-nav { width: calc(100% - 12px); }
  .nav-btn { font-size: 11px; }
  .header-metric { padding: 9px; }
}
</style>
</head>

<main class="app-shell">

        <span>总体进度</span>
        <span id="totalPct">0%</span>

    <div class="header-metrics">

        <div class="header-metric-label">章节</div>

      </div>
      <div class="header-metric">
        <div class="header-metric-label">已学时长</div>
        <div class="header-metric-value" id="doneTimeMetric">0小时</div>
      </div>
      <div class="header-metric">

        <div class="header-metric-value" id="remainTimeMetric">0小时</div>
      </div>
      <div class="header-metric">
        <div class="header-metric-label">推荐日均</div>
        <div class="header-metric-value" id="dailyMetric">60分钟</div>
      </div>
    </div>
  </section>

  <section class="page active" id="page-progress">
    <div class="section-title">课程进度 <span class="section-note" id="progressNote"></span></div>
    <div class="subject-grid" id="subjectGrid"></div>
  </section>

  <section class="page" id="page-stats">
    <div class="section-title">时长分析 <span class="section-note">按已完成记录动态更新</span></div>
    <div class="metric-grid" id="statsMetrics"></div>
    <div class="panel" style="margin-top:12px">
      <div class="section-title" style="margin-top:0">课程时长分布</div>
      <div id="courseDistribution"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <div class="section-title" style="margin-top:0">近 14 天学习记录</div>
      <div class="study-chart" id="studyChart"></div>
    </div>
  </section>

  <section class="page" id="page-plan">
    <div class="section-title">学习计划 <span class="section-note">考试日期：2026年9月19日</span></div>
    <div class="plan-grid" id="planGrid"></div>
    <div class="panel" style="margin-top:12px">
      <div class="section-title" style="margin-top:0">推荐节奏</div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section class="page" id="page-todo">
    <div class="section-title">待看章节 <span class="section-note" id="todoNote"></span></div>
    <div class="filter-bar" id="todoFilters"></div>
    <div class="video-list" id="todoList"></div>
  </section>

  <section class="page" id="page-all">
    <div class="section-title">全部章节 <span class="section-note" id="allNote"></span></div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="search" placeholder="搜索课程或章节" oninput="renderAll()">
    </div>
    <div class="filter-bar" id="allFilters"></div>
    <div class="video-list" id="allList"></div>
    <div class="utilities">
      <button class="utility-btn" type="button" onclick="exportProgress()">导出进度</button>
      <label class="import-label" for="importProgress">导入进度</label>
      <input class="import-input" id="importProgress" type="file" accept="application/json" onchange="importProgress(event)">
      <button class="utility-btn danger" type="button" onclick="resetProgress()">重置进度</button>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="页面导航">
  <button class="nav-btn active" id="nav-progress" type="button" onclick="switchPage('progress')">进度</button>
  <button class="nav-btn" id="nav-stats" type="button" onclick="switchPage('stats')">统计</button>
  <button class="nav-btn" id="nav-plan" type="button" onclick="switchPage('plan')">计划</button>
  <button class="nav-btn" id="nav-todo" type="button" onclick="switchPage('todo')">待看</button>
  <button class="nav-btn" id="nav-all" type="button" onclick="switchPage('all')">全部</button>
</nav>

<div class="toast" id="toast"></div>

const STORAGE_KEY = 'ciia_juan2_progress_v1';

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function localDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function videoKey(video) {
  return `${video.subject}::${video.chapter}::${video.durationMin}`;
}

function formatMinutes(minutes) {
  const safe = Math.max(0, Math.round(minutes || 0));
  if (safe < 60) return `${safe}分钟`;
  const h = Math.floor(safe / 60);
  const m = safe % 60;
  return m ? `${h}小时${m}分钟` : `${h}小时`;
}

function formatHours(minutes) {
  return `${Math.round((minutes || 0) / 60 * 10) / 10}小时`;
}

function getDaysToExam() {
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const [y, m, d] = DATA_CIIA_JUAN2.examDate.split('-').map(Number);
  const exam = new Date(y, m - 1, d);
  return Math.ceil((exam - todayStart) / 86400000);
}

function getTotals() {
  const total = videos.length;
  const done = videos.filter(v => v.done).length;
  const totalMin = videos.reduce((sum, v) => sum + v.durationMin, 0);
  const doneMin = videos.filter(v => v.done).reduce((sum, v) => sum + v.durationMin, 0);
  const remainingMin = totalMin - doneMin;
  const days = Math.max(1, getDaysToExam());
  const expectedDaily = remainingMin / days;
  const recommendedDaily = remainingMin <= 0 ? 0 : Math.max(Math.ceil(expectedDaily * 1.25), 60);
  return { total, done, totalMin, doneMin, remainingMin, days, expectedDaily, recommendedDaily };
}

function getSubjectStats() {
  return DATA_CIIA_JUAN2.subjects.map(subject => {
    const rows = videos.filter(v => v.subject === subject.name);
    const doneRows = rows.filter(v => v.done);
    return {
      ...subject,
      total: rows.length,
      done: doneRows.length,
      totalMin: rows.reduce((sum, v) => sum + v.durationMin, 0),
      doneMin: doneRows.reduce((sum, v) => sum + v.durationMin, 0)
    };
  });
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    completionMap = parsed.completedAtByKey || {};
    videos = videos.map(v => ({ ...v, done: Boolean(completionMap[videoKey(v)]) }));
  } catch {
    completionMap = {};
  }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: 1,
    examDate: DATA_CIIA_JUAN2.examDate,
    completedAtByKey: completionMap
  }));
}

function makeCompletionRecord(video) {
  const now = new Date();
  return {
    at: now.toISOString(),
    date: localDateKey(now),
    durationMin: video.durationMin,
    subject: video.subject,
    chapter: video.chapter
  };
}

function getDatedRecords() {
  return videos
    .filter(v => v.done)
    .map(v => ({ video: v, record: completionMap[videoKey(v)] }))
    .filter(item => item.record && item.record.date);
}

function lastDateKeys(days) {
  const keys = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    keys.push(localDateKey(d));
  }
  return keys;
}

function shortDateLabel(key) {
  const [, month, day] = key.split('-');
  return `${Number(month)}/${Number(day)}`;
}

  const dateTotals = {};
  records.forEach(({ video, record }) => {

  return items.map(item => {
    const active = activeKey === item.key ? 'active' : '';
    const action = target === 'todo' ? `setTodoFilter('${escapeHtml(item.key)}')` : `setAllFilter('${escapeHtml(item.key)}')`;
    return `<button class="filter-btn ${active}" type="button" onclick="${action}">${escapeHtml(item.label)}</button>`;
  }).join('');
}

function renderVideoItem(video, showSubject) {
  const doneClass = video.done ? 'done' : '';
  return `
    <div class="video-item ${doneClass}" onclick="toggleVideo(${video.id})">
      <div class="video-check">${video.done ? '✓' : ''}</div>
      <div class="video-info">
        <div class="video-episode">${escapeHtml(video.episode)}</div>
        <div class="video-meta">
          ${showSubject ? `<span class="tag">${escapeHtml(video.subject)}</span>` : ''}
          <span class="tag time">${escapeHtml(video.duration)}</span>
        </div>
      </div>
    </div>
  `;
}

function renderTodo() {
  document.getElementById('todoFilters').innerHTML = buildFilters(todoFilter, 'todo');
  const rows = videos.filter(v => !v.done && (todoFilter === 'all' || v.subject === todoFilter));
  const totalMin = rows.reduce((sum, v) => sum + v.durationMin, 0);
  document.getElementById('todoNote').textContent = `${rows.length} 章 · ${formatMinutes(totalMin)}`;
  document.getElementById('todoList').innerHTML = rows.length
    ? rows.map(v => renderVideoItem(v, true)).join('')
    : '<div class="empty">没有待看章节了。</div>';
}

function setTodoFilter(key) {
  todoFilter = key;
  renderTodo();
}

function renderAll() {
  document.getElementById('allFilters').innerHTML = buildFilters(allFilter, 'all');
  const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const rows = videos.filter(v => {
    const matchCourse = allFilter === 'all' || v.subject === allFilter;
    const haystack = `${v.subject} ${v.episode} ${v.chapter}`.toLowerCase();
    return matchCourse && (!query || haystack.includes(query));
  });
  document.getElementById('allNote').textContent = `${rows.length} / ${videos.length} 章`;
  document.getElementById('allList').innerHTML = rows.length
    ? rows.map(v => renderVideoItem(v, allFilter === 'all')).join('')
    : '<div class="empty">没有找到匹配章节。</div>';
}

function setAllFilter(key) {
  allFilter = key;
  renderAll();
}

function toggleVideo(id) {
  const video = videos[id];
  if (!video) return;
  const key = videoKey(video);
  video.done = !video.done;
  if (video.done) {
    completionMap[key] = makeCompletionRecord(video);
    showToast('已标记完成');
  } else {
    delete completionMap[key];
    showToast('已取消完成');
  }
  saveProgress();
  renderAllViews();
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('active', el.id === `page-${page}`));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.id === `nav-${page}`));
  renderCurrentPage();
}

function renderCurrentPage() {
  renderHeader();
  if (currentPage === 'progress') renderProgress();
  if (currentPage === 'stats') renderStats();
  if (currentPage === 'plan') renderPlan();
  if (currentPage === 'todo') renderTodo();
  if (currentPage === 'all') renderAll();
}

function renderAllViews() {
  renderHeader();
  renderProgress();
  if (currentPage === 'stats') renderStats();
  if (currentPage === 'plan') renderPlan();
  if (currentPage === 'todo') renderTodo();
  if (currentPage === 'all') renderAll();
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function resetProgress() {
  if (!confirm('确定要清空本机保存的 CIIA 卷二学习进度吗？')) return;
  completionMap = {};
  videos = videos.map(v => ({ ...v, done: false }));
  saveProgress();
  renderAllViews();
  showToast('进度已重置');
}

function exportProgress() {
  const blob = new Blob([JSON.stringify({
    exportedAt: new Date().toISOString(),
    examDate: DATA_CIIA_JUAN2.examDate,
    completedAtByKey: completionMap
  }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ciia-juan2-progress.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importProgress(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || '{}'));
      completionMap = parsed.completedAtByKey || {};
      videos = videos.map(v => ({ ...v, done: Boolean(completionMap[videoKey(v)]) }));
      saveProgress();
      renderAllViews();
      showToast('进度已导入');
    } catch {
      alert('导入失败：JSON 文件格式不正确。');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

loadProgress();
renderAllViews();
</script>
</body>
</html>
